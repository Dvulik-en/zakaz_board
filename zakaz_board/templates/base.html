<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заготовительный участок</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; padding:0; background:#f4f5f7; color:#222; }
  nav { background:#1f4e78; display:flex; }
  nav a { color:#fff; text-decoration:none; padding:14px 18px; font-size:14px; opacity:.75; }
  nav a.active { opacity:1; font-weight:bold; border-bottom:3px solid #ff9800; }
  main { padding:12px; max-width:1100px; margin:0 auto; }
  h1 { font-size:18px; margin:8px 0 14px; }
  .msg { background:#fff3cd; border:1px solid #ffe69c; padding:8px 12px; border-radius:6px; margin-bottom:12px; font-size:13px; }
  details { background:#fff; border-radius:8px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.10); overflow:hidden; }
  details > summary { list-style:none; cursor:pointer; padding:10px 14px; font-weight:bold; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::before { content:"▸ "; }
  details[open] > summary::before { content:"▾ "; }
  .progress { font-weight:normal; opacity:.85; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; }
  th, td { padding:6px 10px; text-align:left; border-bottom:1px solid #eee; }
  select, input, button { padding:5px 8px; border-radius:4px; border:1px solid #ccc; font-size:13px; }
  button { background:#1f4e78; color:#fff; border:none; cursor:pointer; }
  button.secondary { background:#eee; color:#222; border:1px solid #ccc; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; background:#fff; padding:10px; border-radius:8px; }
  .card { background:#fff; padding:12px; border-radius:8px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.10); }
  tr.st-done { background:#c6efce; }
  tr.st-progress { background:#fff2cc; }
  tr.st-todo { background:#fce4d6; }
  @media (max-width:600px) { nav a { padding:10px; font-size:12px; } }
</style>
</head>
<body>
<nav>
  <a href="/" class="{{ 'active' if active=='pdo' else '' }}">ПДО</a>
  <a href="/tehnolog" class="{{ 'active' if active=='tehnolog' else '' }}">Технолог</a>
  <a href="/uchetnik" class="{{ 'active' if active=='uchetnik' else '' }}">Учётчик</a>
  <a href="/plazmenshik" class="{{ 'active' if active=='plazmenshik' else '' }}">Плазменщик</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
